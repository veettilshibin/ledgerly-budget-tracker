<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15112b">
  <title>Ledgerly Cloud</title>
  <style>
    :root{--bg:#15112b;--card:#231d42;--text:#f8f7ff;--muted:#c5c1dd;--accent:#8b7cff;--danger:#d85178;--line:#4b4473}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,#15112b,#0d3140);color:var(--text);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
    main{max-width:820px;margin:auto;padding:28px 16px 60px}
    h1,h2,p{margin-top:0}
    .card{background:rgba(35,29,66,.94);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 32px #0003}
    .hidden{display:none!important}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .wide{grid-column:1/-1}
    label{display:grid;gap:5px;color:var(--muted)}
    input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid var(--line)}
    input,select{background:#17132d;color:var(--text);width:100%}
    button{background:var(--accent);color:white;border:0;font-weight:700;cursor:pointer}
    .secondary{background:#514a78}
    .danger{background:var(--danger)}
    small,.muted{color:var(--muted)}
    table{width:100%;border-collapse:collapse;margin-top:14px}
    th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
    td:last-child{text-align:right}
    .income{color:#8de3a5}
    .expense{color:#ff9cba}
    .notice{border-left:4px solid var(--accent);padding-left:10px;color:var(--muted)}
    @media(max-width:560px){
      .grid{grid-template-columns:1fr}
      table{font-size:.86rem}
      th:nth-child(3),td:nth-child(3){display:none}
    }
  </style>
</head>
<body>
<main>
  <header class="row">
    <div>
      <h1>◈ Ledgerly Cloud</h1>
      <p class="muted">Your budget, available on every signed-in device.</p>
    </div>
    <button id="signOut" class="secondary hidden" type="button">Sign out</button>
  </header>

  <section id="authCard" class="card">
    <h2>Sign in or create an account</h2>
    <p class="notice">Use an email and password. Your transactions are private to your account.</p>
    <form id="authForm" class="grid">
      <label class="wide">Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label class="wide">Password
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      </label>
      <button type="submit">Sign in</button>
      <button id="signUp" type="button" class="secondary">Create account</button>
    </form>
    <p id="authMessage" class="muted" aria-live="polite"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card row">
      <div>
        <h2 id="welcome">Ledgerly</h2>
        <p id="totals" class="muted">Loading…</p>
      </div>
      <button id="refresh" class="secondary" type="button">Refresh</button>
    </div>

    <section class="card">
      <h2>Add transaction</h2>
      <form id="transactionForm" class="grid">
        <label>Type
          <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>
        <label>Amount
          <input id="amount" type="number" min="0.01" step="0.01" required>
        </label>
        <label>Category
          <input id="category" maxlength="80" placeholder="Groceries" required>
        </label>
        <label>Date
          <input id="date" type="date" required>
        </label>
        <label class="wide">Note (optional)
          <input id="note" maxlength="500" placeholder="Weekly shopping">
        </label>
        <button class="wide" type="submit">Save to cloud</button>
      </form>
      <p id="transactionMessage" class="muted" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="row">
        <h2>Transactions</h2>
        <button id="deleteAll" class="danger" type="button">Delete all</button>
      </div>
      <div id="empty" class="muted">No transactions yet.</div>
      <table id="table" class="hidden">
        <thead>
          <tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://nxpwrprenuxplactjrpj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BFirLzmycGWYvT7vxQIpsw_8e1I-DEz';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const usd = n => new Intl.NumberFormat('en-US', {
  style: 'currency', currency: 'USD'
}).format(Number(n) || 0);
const today = () => new Date().toISOString().slice(0, 10);

let currentUser = null;
let transactions = [];

function message(id, text) {
  $(id).textContent = text || '';
}

function showApp(on) {
  $('authCard').classList.toggle('hidden', on);
  $('app').classList.toggle('hidden', !on);
  $('signOut').classList.toggle('hidden', !on);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function render() {
  const income = transactions
    .filter(x => x.type === 'income')
    .reduce((sum, x) => sum + Number(x.amount), 0);
  const expenses = transactions
    .filter(x => x.type === 'expense')
    .reduce((sum, x) => sum + Number(x.amount), 0);

  $('totals').textContent =
    `Income ${usd(income)} · Expenses ${usd(expenses)} · Balance ${usd(income - expenses)}`;

  const rows = $('rows');
  rows.replaceChildren();
  $('empty').classList.toggle('hidden', transactions.length > 0);
  $('table').classList.toggle('hidden', transactions.length === 0);

  transactions.forEach(item => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${item.transaction_date}</td>
      <td>${escapeHtml(item.category)}</td>
      <td>${escapeHtml(item.note || '—')}</td>
      <td class="${item.type}">${item.type === 'income' ? '+' : '−'}${usd(item.amount)}</td>
      <td><button class="danger" type="button">Delete</button></td>
    `;
    row.querySelector('button').onclick = () => removeTransaction(item.id);
    rows.append(row);
  });
}

async function load() {
  if (!currentUser) return;

  message('transactionMessage', 'Loading cloud data…');

  const { data, error } = await db
    .from('transactions')
    .select('id, transaction_date, type, category, amount, note, created_at')
    .order('transaction_date', { ascending: false })
    .order('created_at', { ascending: false });

  if (error) {
    message('transactionMessage', error.message);
    return;
  }

  transactions = data || [];
  render();
  message('transactionMessage', '');
}

async function removeTransaction(id) {
  if (!confirm('Delete this transaction?')) return;

  const { error } = await db.from('transactions').delete().eq('id', id);
  if (error) return alert(error.message);

  await load();
}

$('authForm').onsubmit = async event => {
  event.preventDefault();
  message('authMessage', 'Signing in…');

  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });

  message('authMessage', error ? error.message : 'Signed in.');
};

$('signUp').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || password.length < 6) {
    return message('authMessage', 'Enter an email and a password with at least 6 characters.');
  }

  message('authMessage', 'Creating account…');

  const { data, error } = await db.auth.signUp({ email, password });

  message(
    'authMessage',
    error
      ? error.message
      : data.session
        ? 'Account created and signed in.'
        : 'Account created. Check your email to confirm, then sign in.'
  );
};

$('signOut').onclick = () => db.auth.signOut();

$('transactionForm').onsubmit = async event => {
  event.preventDefault();
  message('transactionMessage', 'Saving…');

  const item = {
    transaction_date: $('date').value,
    type: $('type').value,
    amount: Number($('amount').value),
    category: $('category').value.trim(),
    note: $('note').value.trim()
  };

  if (!item.transaction_date || !item.category || !(item.amount > 0)) {
    return message('transactionMessage', 'Enter a valid date, category, and amount.');
  }

  const { error } = await db.from('transactions').insert(item);
  if (error) return message('transactionMessage', error.message);

  event.target.reset();
  $('date').value = today();
  message('transactionMessage', 'Saved.');
  await load();
};

$('refresh').onclick = load;

$('deleteAll').onclick = async () => {
  if (!confirm('Permanently delete all transactions in your account?')) return;

  const { error } = await db.from('transactions').delete().not('id', 'is', null);
  if (error) return alert(error.message);

  await load();
};

async function session() {
  const { data: { session } } = await db.auth.getSession();
  currentUser = session?.user || null;

  showApp(Boolean(currentUser));

  if (currentUser) {
    $('welcome').textContent = `Ledgerly · ${currentUser.email}`;
    $('date').value = today();
    await load();
  }
}

db.auth.onAuthStateChange(() => setTimeout(session, 0));
session();
</script>
</body>
</html>
